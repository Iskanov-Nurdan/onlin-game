<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему</title>
    <style>
        :root {
            --primary:rgb(173, 173, 173);
            --primary-light:rgb(23, 18, 27);
            --background: #f8f4ff;
            --card: #ffffff;
            --text: #333;
            --border: #e0d0ff;
            --error: #ff3860;
            --success: #4caf50;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: var(--background);
            margin: 0;
            padding: 0;
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .login-container {
            width: 100%;
            max-width: 450px;
            padding: 0 20px;
        }
        
        .login-card {
            background: var(--card);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(106, 13, 173, 0.15);
            text-align: center;
        }
        
        .logo {
            color: var(--primary);
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        h1 {
            color: var(--primary);
            margin: 0 0 30px 0;
            font-size: 1.8rem;
        }
        
        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--primary);
        }
        
        .form-group input {
            width: 100%;
            padding: 14px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .form-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(106, 13, 173, 0.2);
            outline: none;
        }
        
        .btn {
            display: inline-block;
            background: var(--primary);
            color: white;
            padding: 14px 30px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 16px;
            width: 100%;
            margin-top: 10px;
        }
        
        .btn:hover {
            background: var(--primary-light);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(106, 13, 173, 0.3);
        }
        
        .links {
            margin-top: 25px;
            font-size: 15px;
        }
        
        .links a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .links a:hover {
            color: var(--primary-light);
            text-decoration: underline;
        }
        
        .errorlist {
            color: var(--error);
            margin: 5px 0 0 0;
            padding-left: 0;
            list-style: none;
            font-size: 14px;
        }
        
        .messages {
            margin-bottom: 25px;
        }
        
        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        
        .message.success {
            background-color: rgba(76, 175, 80, 0.2);
            color: var(--success);
        }
        
        .message.error {
            background-color: rgba(255, 56, 96, 0.2);
            color: var(--error);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo">🛍️</div>
            <h1>Вход в аккаунт</h1>
            
            {% if messages %}
            <div class="messages">
                {% for message in messages %}
                <div class="message {{ message.tags }}">{{ message }}</div>
                {% endfor %}
            </div>
            {% endif %}
            
            <form method="post">
                {% csrf_token %}
                
                {% for field in form %}
                <div class="form-group">
                    {{ field.label_tag }}
                    {{ field }}
                    
                    {% for error in field.errors %}
                        <ul class="errorlist">
                            <li>{{ error }}</li>
                        </ul>
                    {% endfor %}
                </div>
                {% endfor %}
                
                <button type="submit" class="btn">Войти</button>
                
                <div class="links">
                    <p>Нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a></p>
                  
                </div>
            </form>
        </div>
    </div>
</body>
</html>

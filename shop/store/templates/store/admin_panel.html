<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Админ панель</title>
    <style>
        body {
            font-family: 'Uncial Antiqua', serif;
            background: url('https://economist.kg/content/images/wp-content/uploads/2023/01/zaglavnoe-foto-ilo-20.png') no-repeat center center fixed;
            background-size: cover;
            color: #c2a679;
            margin: 0;
            padding: 0;
        }
        
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        nav {
            background-color:rgb(49, 29, 228);
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
        }
        nav a {
            display: block;
            color: #ffffff;
            text-align: center;
            padding: 14px 20px;
            text-decoration: none;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        nav a:hover {
            background-color:rgb(15, 200, 233);
        }
        h1 {
            color:rgb(44, 165, 196);
            text-align: center;
            margin-top: 20px;
        }
        .admin-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            margin-top: 30px;
        }
        .admin-button {
            background-color:rgb(20, 209, 200);
            color: #fff;
            padding: 15px 25px;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s, transform 0.3s;
        }
        .admin-button:hover {
            background-color:rgb(56, 43, 68);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'product_list' %}">Главная</a>
        <a href="{% url 'profile' %}">Профиль</a>
        <a href="{% url 'admin_panel' %}">Админ панель</a>
        {% if user.is_authenticated %}
            <a href="{% url 'logout' %}">Выйти</a>
        {% else %}
            <a href="{% url 'login' %}">Вход</a>
            <a href="{% url 'register' %}">Регистрация</a>
        {% endif %}
    </nav>

    <div class="container">
        <h1>Админ панель</h1>
        <div class="admin-buttons">
            <a class="admin-button" href="{% url 'product_create' %}">🔤 Добавить перевод</a>
            <a class="admin-button" href="{% url 'product_list' %}">📄 Управление переводами</a>
            <a class="admin-button" href="{% url 'manage_users' %}">👤Управление пользователями</a>
            <!-- Можно добавить другие кнопки для перехода к другим разделам админпанели -->
        </div>
    </div>

    
</body>
</html>
